[project]
name = "when2meet-vod"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastapi (>=0.115.12,<0.116.0)", "uvicorn (>=0.34.0,<0.35.0)", "orjson (>=3.10.16,<4.0.0)", "sqids (>=0.5.1,<0.6.0)", "tortoise-orm[asyncmy] (>=0.24.2,<0.25.0)", "cryptography (>=44.0.2,<45.0.0)", "aerich (>=0.8.2,<0.9.0)", "pydantic-settings (>=2.8.1,<3.0.0)", "tomlkit (>=0.13.2,<0.14.0)"]

[[project.authors]]
name = "LucasKim4321"
email = "xowls0131@naver.com"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
ruff = "^0.11.4"
mypy = "^1.15.0"
pytest = "^8.3.5"
coverage = "^7.8.0"
pytest-asyncio = "^0.26.0"

[tool.black]
line-length = 120

[tool.ruff]
target-version = "py313"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = 3.13
strict = true

[tool.coverage.run]
omit = ["*/test_*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.aerich]
tortoise_orm = "app.configs.tortoise_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
